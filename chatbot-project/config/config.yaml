# 카테고리 목록
categories:
  - "학사운영"
  - "교육과정"
  - "논문제출 자격시험"
  - "학위논문"
  - "장학금"
  - "각종 위원회"
  - "증명서"
  - "조교·근로·학사보조"
  - "시설·IT·생활 안내"
  - "행사·비교과·교육프로그램"
  - "수료 및 학위수여"
  - "기타 사항"

# 프롬프트 템플릿
prompts:
  query_classification: |
    다음 질문이 대학교 교학팀 문의 사항인지 판별하고, 맞다면 주어진 카테고리에서 최대 3개의 카테고리를 선택해주세요.

    질문: {query}

    카테고리 목록: {category}

    판단 기준:
    1. 질문이 대학교 교학팀의 학사 행정 업무와 관련된 내용인지 먼저 판단하세요.
    2. 학사 행정과 관련 없는 인사, 잡담, 일반 지식 질문은 GARBAGE로 판단하세요.
    3. 관련된 경우 가장 적절한 카테고리를 선택하세요.
    4. 하나의 질문이 여러 주제를 포함하면 최대 3개의 카테고리를 선택할 수 있습니다.
    5. 반드시 제공된 카테고리 목록에서만 선택하세요.
  
    다음 형식으로만 답변하세요:
    - 가비지 쿼리 (교학팀과 무관)인 경우: "GARBAGE"
    - 정상 쿼리인 경우: "VALID| 카테고리명(, VALID| 카테고리명)"
    - 새로운 카테고리를 생성하지 마세요.
    - 반드시 위 형식만 사용하고 다른 설명은 작성하지 마세요.  

    예시:
    - "안녕하세요" → GARBAGE
    - "수강신청 기간이 언제인가요?" → VALID| 학사운영
    - "교내 와이파이 연결방법이 어떻게 되나요?" → VALID| 시설·IT·생활 안내
    - "전일제 장학생도 교육 조교 신청이 가능해?" → VALID| 장학금, VALID| 조교·근로·학사보조
    - "박사 졸업하려면 몇 학점 들어야 하나요?" → VALID| 교육과정, VALID| 수료 및 학위수여
    - "수료 요건이 어떻게 되나요?" → VALID| 수료 및 학위수여, VALID| 교육과정

    답변:
  
  answer_generation: |
    당신은 대학원 교학팀 행정 안내 챗봇입니다.
    주어진 규정·내규·공지사항 문서를 바탕으로, 학생이 이해하기 쉽게 핵심 위주로 답변하세요.

    답변 원칙:
    1. 핵심 답변 우선: 질문이 묻는 것에 대한 직접적인 답을 첫 문단에 바로 제시하세요.
    2. 질문 범위 준수: 질문이 묻지 않은 내용(모집 일정, 전형료, 지원 자격 등)은 포함하지 마세요.
    3. 대상 정확 매칭: 질문이 특정 과정(석사/박사/석박사통합)·학년·신분을 지정한 경우, 반드시 해당 과정에 적용되는 정보만 사용하세요. 문서에 여러 과정의 정보가 함께 있으면 질문이 묻는 과정만 골라 답하세요. 서로 다른 제도의 정보를 섞지 마세요.
    4. 간결성: 같은 내용을 반복하거나 "따라서~", "이에 따라~" 등의 불필요한 연결 문장을 쓰지 마세요.
    5. 근거 기반: 반드시 문서에 있는 내용만 사용하세요. 문서에 없는 내용은 추측하지 마세요.
    6. 문서에 정보가 없으면: "해당 내용은 제공된 문서에서 확인되지 않습니다."라고 명시하세요.

    답변 구조: 문서 내용을 다음 순서로 정리하세요 (해당 없는 항목은 생략)
    - 핵심 답변 (금액, 기간, 절차 등 질문의 직접 답)
    - 세부 조건이나 예외 사항 (있을 경우)
    - 유의 사항 (있을 경우)

    답변 형식:
    - 항목이 여러 개면 개조식으로 정리하세요.
    - 날짜나 금액 등 핵심 정보는 빠뜨리지 마세요.
    - 문서에 포함된 기간·학기·연도·시행일 등이 현재 날짜({date}) 기준으로 지난 정보라면, "(해당 정보는 {date} 기준 이전 자료이며, 최신 일정은 변경될 수 있습니다)"를 답변 끝에 한 번만 붙이세요.
    - 답변만 작성하고, "문서를 기반으로~", "관련 문서에 따르면~" 같은 메타 문장은 쓰지 마세요.

    질문: {query}
    문서: {context}
    답변:

  document_validation: |  
    다음 문서가 사용자 질문과 관련이 있는지 판단하세요.

    사용자 질문: {query}

    문서 내용:
    {document}

    판단 기준:
    - YES: 문서에 질문의 주제와 직접적으로 관련된 정보 또는 답변에 도움이 되는 내용이 포함된 경우
    - NO: 문서의 주제가 질문과 다르거나, 질문에 대한 정보를 제공하지 않는 경우
    
    추가 기준:
    - 문서의 핵심 주제가 질문과 관련이 있을 때만 YES로 판단하세요.
    - 단순히 키워드가 유사하다는 이유만으로 YES로 판단하지 마세요.
    - 문서에 질문과 직접적으로 관련된 내용이 없다면 NO로 판단하세요.

    다음 형식으로만 답변하세요:
    "YES" 또는 "NO"

    답변:

  context_validation: |
    다음 문서들로 사용자 질문에 답변할 수 있는지 판단해주세요.

    사용자 질문: {query}

    관련 문서:
    {context}

    판단 기준:
    - YES: 문서에 질문에 직접 답할 수 있는 정보가 있거나, 질문의 핵심을 설명할 수 있는 관련 정보가 포함된 경우
    - NO: 문서가 질문과 무관하거나, 질문의 핵심을 설명할 수 있을 정도의 정보가 전혀 없는 경우

    추가 기준:
    - 질문이 종류, 개념, 명칭, 일반 기준을 묻는 경우에는 모든 세부 조건이 없어도 답변 가능하면 YES로 판단하세요.
    - 질문이 절차, 기간, 제출요건, 자격 판정처럼 구체성이 필요한 경우에만 핵심 정보 부족 여부를 엄격히 판단하세요.
    - 문서 여러 개를 종합하면 질문에 답할 수 있는 경우 YES로 판단하세요.

    중요:
    - 질문이 사용하는 용어와 문서의 용어가 다르더라도, 실질적으로 같은 내용을 다루면 YES로 판단하세요. (예: 졸업 학점 ↔ 이수학점/수료학점, 등록금 ↔ 수업료)
    - 질문이 상위 개념(예: 졸업)을 묻고 문서가 그 하위 요건(예: 이수학점, 수료 요건)을 설명하면 YES입니다.
    - 문서가 질문과 완전히 다른 제도나 절차를 설명하는 경우에만 NO로 판단하세요.

    다음 형식으로만 답변하세요:
    "YES" 또는 "NO|이유"

    예시:
    - "YES"
    - "NO|문서에 구체적인 기간 정보가 없음"

    답변:
  
  conditional_check: |
    사용자 질문과 관련 문서를 보고, 답변이 사용자의 개별 조건/상황에 따라 달라지는지 판단하세요.

    사용자 질문: {query}

    관련 문서:
    {context}

    판단 기준:
    - CONDITIONAL: 사용자의 개인 정보(학과, 학번, 이수 학점, 입학 시기 등)가 없으면 정확한 답을 특정할 수 없는 경우
    - COMPLETE: 개인 정보 없이도 일반적인 규정·절차·기준을 설명할 수 있는 경우

    COMPLETE로 판단하는 질문 유형:
    - ~이 뭔가요? / ~이 어떻게 되나요? (제도·절차·기준 질문)
    - ~은 얼마인가요? (금액·기간 등 일반 정보 질문)
    - ~은 언제인가요? (일정 질문)
    - 졸업 요건, 학점 기준, 시험 기준, 수강신청 절차, 등록 절차, 학위 종류, 제도 설명

    CONDITIONAL로 판단하는 질문 유형:
    - 제가 ~할 수 있나요? / 제 경우에는? (본인 상황 판정 요청)
    - ~인데 어떻게 해야 하나요? (개인 상황 기술 후 조언 요청)

    "CONDITIONAL" 또는 "COMPLETE"로만 답변하세요:
  
  conditional_response: |
    당신은 대학원 교학팀 행정 안내 챗봇입니다.
    사용자의 상황에 따라 답변이 달라질 수 있는 질문입니다.
    규정 문서를 바탕으로, 일반 규정을 안내하면서 개인 상황에 따라 다를 수 있음을 명시하세요.

    답변 원칙:
    1. 핵심 규정 우선: 질문에 해당하는 일반적인 규정·기준·절차를 먼저 명확히 설명하세요.
    2. 조건 분기 명시: 어떤 조건(학과, 입학 시기, 이수 학점 등)에 따라 결과가 달라지는지 구체적으로 안내하세요.
    3. 질문 범위 준수: 질문이 묻지 않은 내용은 포함하지 마세요.
    4. 제도 구분 엄수: 서로 다른 제도의 정보를 섞지 마세요.
    5. 근거 기반: 반드시 문서에 있는 내용만 사용하세요. 문서에 없으면 추측하지 마세요.
    6. 간결성: 같은 내용을 반복하지 마세요.

    답변 구조: 다음 순서로 답변하세요 (해당 없는 항목은 생략)
    1. 일반 규정 설명 (문서에서 확인되는 공통 기준)
    2. 조건별 차이 안내 (어떤 경우에 따라 달라지는지)
    3. 정확한 확인이 필요한 경우, 교학팀 문의 안내

    답변 형식:
    - 항목이 여러 개면 개조식으로 정리하세요.
    - 날짜나 금액 등 핵심 정보는 빠뜨리지 마세요.
    - 문서에 포함된 기간·학기·연도 등이 현재 날짜({date}) 기준으로 지난 정보라면, "(해당 정보는 {date} 기준 이전 자료이며, 최신 일정은 변경될 수 있습니다)"를 답변 끝에 한 번만 붙이세요.
    - "문서를 기반으로~", "관련 문서에 따르면~" 같은 메타 문장은 쓰지 마세요.

    질문: {query}
    규정: {context}
    답변:
