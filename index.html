<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITalk</title>
    <!-- 🎓 이모지 파비콘 -->
    <link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <text y='0.9em' x='0.5em' text-anchor='middle' font-size='80'>🎓</text>
    </svg>">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --bg-gray: #f3f4f6;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
            --transition-fast: 0.15s;
            --transition-normal: 0.3s;
            --transition-slow: 0.5s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            max-width: 640px;
            width: 100%;
            height: 85vh;
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(0);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        }

        .chat-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .chat-header {
            padding: 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .chat-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            position: relative;
        }

        .chat-header p {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-top: 4px;
            position: relative;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.3), 0 0 8px rgba(74, 222, 128, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-gray);
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.5;
            position: relative;
            animation: messageIn var(--transition-normal) cubic-bezier(0.16, 1, 0.3, 1) forwards;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: white;
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .response-type {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            backdrop-filter: blur(4px);
        }

        .response-type.direct {
            background: rgba(34, 197, 94, 0.15);
            color: #16a34a;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .response-type.conditional {
            background: rgba(245, 158, 11, 0.15);
            color: #d97706;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .response-type.human_handoff {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .cited-regulations {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #e5e7eb;
            font-size: 0.85rem;
        }

        .cited-regulations summary {
            cursor: pointer;
            color: var(--text-gray);
            padding: 8px 12px;
            background: var(--bg-gray);
            border-radius: 8px;
            list-style: none;
        }

        .cited-regulations summary::before {
            content: '▶';
            display: inline-block;
            margin-right: 8px;
            font-size: 0.7rem;
            transition: transform var(--transition-fast);
        }

        .cited-regulations details[open] summary::before {
            transform: rotate(90deg);
        }

        .cited-regulations ul {
            margin-top: 8px;
            list-style: none;
        }

        .cited-regulations li {
            padding: 8px 12px;
            margin: 4px 0;
            background: var(--bg-gray);
            border-radius: 6px;
            color: var(--text-gray);
            font-size: 0.8rem;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 20px;
            background: white;
            border-radius: 16px;
            align-self: flex-start;
        }

        .loading span {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-input {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
        }

        .input-wrapper textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            outline: none;
            background: var(--bg-gray);
            transition: all var(--transition-fast);
            resize: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .input-wrapper textarea:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .send-button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all var(--transition-fast);
        }

        .send-button:hover {
            transform: scale(1.08);
        }

        .send-button svg {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>BITalk</h1>
            <p>BIT 대학원 학사 안내 에이전트</p>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span>온라인</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">안녕하세요! BIT 대학원 학사 안내 에이전트 BITalk입니다. 🎓<br>BIT 대학원 내규 및 공지사항을 기반으로 학사 행정 관련 질문에 답변해
                드려요.</div>
        </div>

        <div class="chat-input">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="질문을 입력하세요..."></textarea>
            </div>
            <button class="send-button" id="sendButton" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        // Enter: 전송, Shift+Enter: 줄바꿈
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // 줄바꿈은 기본 동작 유지
                    return;
                }
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            userInput.value = '';
            sendButton.disabled = true;

            addMessage(message, 'user');

            // 프로그레스 바 영역 생성
            const progressContainer = document.createElement('div');
            progressContainer.classList.add('message', 'bot');
            progressContainer.innerHTML = '<div class="loading"><span></span><span></span><span></span></div><div class="progress-text" style="font-size:0.85rem; color:#6b7280; margin-top:8px;">요청을 처리하고 있습니다...</div>';
            chatMessages.appendChild(progressContainer);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/query/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message }),
                });

                if (!response.ok) throw new Error('서버 오류');

                // 스트림 읽기 처리
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');

                    // 마지막 줄이 불완전할 수 있으므로 보존
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const dataStr = line.replace('data: ', '');
                                if (!dataStr.trim()) continue;

                                const data = JSON.parse(dataStr);

                                if (data.type === 'progress') {
                                    const progressText = progressContainer.querySelector('.progress-text');
                                    if (progressText) {
                                        progressText.textContent = `⏳ ${data.message}`;
                                    }
                                } else if (data.type === 'result') {
                                    // 최종 응답 수신 시 진행 메시지 삭제 및 봇 응답 생성
                                    progressContainer.remove();
                                    addBotMessage(data.data);
                                }
                            } catch (e) {
                                console.error('SSE 파싱 에러:', e, line);
                            }
                        }
                    }
                    // 스크롤 아래로
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

            } catch (error) {
                progressContainer.remove();
                addMessage('죄송합니다. 오류가 발생했습니다.', 'bot', true);
            } finally {
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(content, type, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', type);
            if (isError) messageDiv.classList.add('error');
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function addBotMessage(data) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'bot');

            let html = '';
            if (data.response_type) {
                const typeConfig = {
                    'direct': { icon: '✅', label: '직접 답변' },
                    'conditional': { icon: '⚠️', label: '조건부 답변' },
                    'human_handoff': { icon: '📞', label: '상담 필요' }
                };
                const config = typeConfig[data.response_type] || { icon: '💬', label: data.response_type };
                html += `<span class="response-type ${data.response_type}">${config.icon} ${config.label}</span><br>`;
            }

            // 간단한 마크다운 파서 (굵은 글씨, 불릿, 줄바꿈)
            let mainAnswer = data.answer || data.message || '응답을 받지 못했습니다.';

            // XSS 방지를 위해 기본 이스케이프 (필요 시 주석 해제)
            // mainAnswer = mainAnswer.replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // 1. 굵은 글씨 변환 (**text**)
            mainAnswer = mainAnswer.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // 2. 불릿 리스트 변환 (- text 또는 * text 또는 • text)
            // 불릿 기호로 시작하는 줄을 스타일이 적용된 div로 감싸고, 뒤따라오는 \n 도 포섭하여 중복 줄바꿈 방지
            mainAnswer = mainAnswer.replace(/^(?:-|\*|\•)\s+(.+)(?:\n|$)/gm, '<div style="display: flex; gap: 8px; margin-bottom: 4px;"><span style="color: var(--primary);">•</span><span>$1</span></div>');

            // 3. 연속된 들여쓰기/불릿이 아닌 일반 줄바꿈을 <br>로 변환
            // CSS의 white-space: pre-wrap; 이 있지만 확실한 렌더링을 위해 <br>태그 혼용
            mainAnswer = mainAnswer.replace(/\n/g, '<br>');

            // 4. 불필요하게 연달아 생기는 <br> 태그 정리
            mainAnswer = mainAnswer.replace(/(<br>\s*){3,}/g, '<br><br>');

            html += `<div class="answer-text" style="line-height: 1.6; margin-top: 6px;">${mainAnswer}</div>`;

            if (data.cited_regulations?.length > 0) {
                html += `
                    <div class="cited-regulations">
                        <details>
                            <summary>📚 참고 규정 (${data.cited_regulations.length}개)</summary>
                            <ul>${data.cited_regulations.map(reg => `<li>${reg}</li>`).join('')}</ul>
                        </details>
                    </div>`;
            }

            messageDiv.innerHTML = html;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('loading');
            loadingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return loadingDiv;
        }

        async function checkServerStatus() {
            try {
                await fetch(`${API_URL}/health`);
            } catch (error) {
                addMessage('⚠️ 서버 연결이 원활하지 않습니다.', 'bot', true);
            }
        }
        checkServerStatus();
    </script>
</body>

</html>
